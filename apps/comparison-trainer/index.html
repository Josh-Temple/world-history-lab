<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historical Comparison Trainer</title>
    <style>
      :root { color-scheme: light; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 16px; background:#f8fafc; color:#0f172a; }
      main { max-width: 960px; margin: 0 auto; }
      .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-bottom: 14px; }
      .card-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
      .card { background:#fff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; }
      .meta { font-size:.95rem; color:#334155; }
      .prompt, .explanation { margin-top:14px; background:#fff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; }
      button, select { font: inherit; padding:8px 10px; border-radius:8px; border:1px solid #94a3b8; }
      button { background:#0f172a; color:#fff; border-color:#0f172a; }
      @media (max-width: 720px) { .card-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Historical Comparison</h1>
      <div class="toolbar">
        <label>Mode
          <select id="mode">
            <option value="different_era">Different era</option>
            <option value="same_era">Same era (&plusmn;25 years)</option>
          </select>
        </label>
        <button id="next-btn" type="button">Next Comparison</button>
      </div>

      <section class="card-grid">
        <article class="card" id="event-a"></article>
        <article class="card" id="event-b"></article>
      </section>

      <section class="prompt">
        <h2>Reflection Prompt</h2>
        <p id="prompt"></p>
      </section>

      <section class="explanation">
        <h2>Explanation Helper</h2>
        <p id="explanation"></p>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
