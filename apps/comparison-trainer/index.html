<!doctype html>
<html lang="en" data-baukasten-ui="1">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historical Comparison Trainer</title>
    <link rel="stylesheet" href="/styles/baukasten-ui.css" />
    <style>
      :root { color-scheme: light; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 16px; background:#f8fafc; color:#0f172a; }
      main { max-width: 960px; margin: 0 auto; }
      .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-bottom: 14px; }
      .card-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
      .card { background:#fff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; }
      .meta { font-size:.95rem; color:#334155; }
      .prompt, .explanation { margin-top:14px; background:#fff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; }
      button, select { font: inherit; padding:8px 10px; border-radius:8px; border:1px solid #94a3b8; }
      button { background:#0f172a; color:#fff; border-color:#0f172a; }
            .session-header { display:flex; justify-content:space-between; align-items:center; margin:10px 0 16px; padding-bottom:8px; border-bottom:1px solid #ddd; font-weight:600; }
      .feedback-correct { color: #166534; }
      .feedback-incorrect { color: #b00020; }
      .confidence-buttons { display:flex; gap:8px; flex-wrap:wrap; }
      .confidence-buttons button { min-height:42px; }
      @media (max-width: 720px) { .card-grid { grid-template-columns: 1fr; } .confidence-buttons button { flex:1 1 45%; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Historical Comparison</h1>
      <section class="session-header" aria-live="polite">
        <div id="session-progress">1 / 10</div>
        <div id="session-mode">Comparison Trainer</div>
      </section>
      <div class="toolbar">
        <label>Mode
          <select id="mode">
            <option value="different_era">Different era</option>
            <option value="same_era">Same era (&plusmn;25 years)</option>
          </select>
        </label>
        <button id="next-btn" type="button">Next Comparison</button>
      </div>

      <section class="card-grid">
        <article class="card" id="event-a"></article>
        <article class="card" id="event-b"></article>
      </section>

      <section class="prompt">
        <h2>Reflection Prompt</h2>
        <p id="prompt"></p>
      </section>

      <section class="explanation">
        <h2>Explanation Helper</h2>
        <p id="feedback" class="meta">Choose your answer confidence after reflecting.</p>
        <p id="explanation"></p>
      </section>

      <section id="confidence-controls" class="prompt">
        <h2>Confidence</h2>
        <div class="confidence-buttons">
          <button type="button" data-confidence="easy">Easy</button>
          <button type="button" data-confidence="unsure">Unsure</button>
          <button type="button" data-confidence="guess">Guess</button>
          <button type="button" data-confidence="skip">Skip</button>
        </div>
      </section>

      <section id="session-summary" class="prompt" hidden>
        <h2>Session Complete</h2>
        <p id="summary-score"></p>
        <button id="retry-weak-items" type="button">Practice Weak Items</button>
      </section>
    </main>
    <script src="/apps/comparison-trainer/main.js"></script>
  </body>
</html>
