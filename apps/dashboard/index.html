<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Learning Dashboard</h1>
    <section id="review-summary"></section>
    <section id="weak-items"></section>
    <section id="recent-units"></section>
    <section id="progression-summary"></section>
    <section id="recommended-paths"></section>
    <section id="thematic-pathways"></section>
    <section id="quick-actions"></section>
    <section id="next-session-panel"></section>
    <section id="guided-session-launch"></section>
    <script type="module">
      document.documentElement.dataset.appState = "loading";
      import("/apps/shared/app-boot.js").then(({ bootApp }) => bootApp({ app: "dashboard", entry: "/apps/dashboard/main.js" })).catch((error) => {
        console.error("[app-boot]", { app: "dashboard", phase: "boot-guard-import", entry: "/apps/dashboard/main.js", error });
        document.documentElement.dataset.appState = "error";
        const alert = document.createElement("p"); alert.id = "app-boot-error"; alert.setAttribute("role", "alert");
        alert.textContent = "The application could not be loaded. Reload this page or reset the offline app cache."; document.body.prepend(alert);
      });
    </script>
  </body>
</html>
