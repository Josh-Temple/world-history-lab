<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Historical Patterns Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Historical Patterns Explorer</h1>
      <label for="concept-select">Pattern</label>
      <select id="concept-select"></select>
    </header>
    <main>
      <section id="concept-summary"></section>
      <section id="event-comparisons"></section>
    </main>
    <script type="module">
      document.documentElement.dataset.appState = "loading";
      import("/apps/shared/app-boot.js").then(({ bootApp }) => bootApp({ app: "historical-patterns", entry: "/apps/historical-patterns/main.js" })).catch((error) => {
        console.error("[app-boot]", { app: "historical-patterns", phase: "boot-guard-import", entry: "/apps/historical-patterns/main.js", error });
        document.documentElement.dataset.appState = "error";
        const alert = document.createElement("p"); alert.id = "app-boot-error"; alert.setAttribute("role", "alert");
        alert.textContent = "The application could not be loaded. Reload this page or reset the offline app cache."; document.body.prepend(alert);
      });
    </script>
  </body>
</html>
