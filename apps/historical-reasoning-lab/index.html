<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historical Reasoning Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Historical Reasoning Lab</h1>
        <p>Practice explaining why events happened, which evidence matters most, and how outcomes might have changed.</p>
      </header>
      <section id="prompt-panel" class="panel"></section>
      <section id="evidence-panel" class="panel"></section>
      <section id="reflection-panel" class="panel"></section>
    </main>
    <script type="module">
      document.documentElement.dataset.appState = "loading";
      import("/apps/shared/app-boot.js").then(({ bootApp }) => bootApp({ app: "historical-reasoning-lab", entry: "/apps/historical-reasoning-lab/main.js" })).catch((error) => {
        console.error("[app-boot]", { app: "historical-reasoning-lab", phase: "boot-guard-import", entry: "/apps/historical-reasoning-lab/main.js", error });
        document.documentElement.dataset.appState = "error";
        const alert = document.createElement("p"); alert.id = "app-boot-error"; alert.setAttribute("role", "alert");
        alert.textContent = "The application could not be loaded. Reload this page or reset the offline app cache."; document.body.prepend(alert);
      });
    </script>
  </body>
</html>
