<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Historical Systems Simulator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="systems-simulator"></main>
  <script type="module">
      document.documentElement.dataset.appState = "loading";
      import("/apps/shared/app-boot.js").then(({ bootApp }) => bootApp({ app: "historical-systems-simulator", entry: "/apps/historical-systems-simulator/main.js" })).catch((error) => {
        console.error("[app-boot]", { app: "historical-systems-simulator", phase: "boot-guard-import", entry: "/apps/historical-systems-simulator/main.js", error });
        document.documentElement.dataset.appState = "error";
        const alert = document.createElement("p"); alert.id = "app-boot-error"; alert.setAttribute("role", "alert");
        alert.textContent = "The application could not be loaded. Reload this page or reset the offline app cache."; document.body.prepend(alert);
      });
    </script>
</body>
</html>
