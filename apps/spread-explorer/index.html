<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Historical Spread Explorer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Historical Spread Explorer</h1>
    <div class="controls">
      <select id="theme-select" aria-label="Spread theme">
        <option value="empire">Empires</option>
        <option value="trade">Trade</option>
        <option value="religion">Religion</option>
        <option value="migration">Migration</option>
      </select>
      <input type="range" id="year-slider" min="-3000" max="2025" value="1500" />
      <div id="year-display"></div>
    </div>
  </header>
  <main>
    <div id="map-container" aria-label="Historical spread map"></div>
    <aside id="event-panel" aria-live="polite"></aside>
  </main>
  <script type="module">
      document.documentElement.dataset.appState = "loading";
      import("/apps/shared/app-boot.js").then(({ bootApp }) => bootApp({ app: "spread-explorer", entry: "/apps/spread-explorer/main.js" })).catch((error) => {
        console.error("[app-boot]", { app: "spread-explorer", phase: "boot-guard-import", entry: "/apps/spread-explorer/main.js", error });
        document.documentElement.dataset.appState = "error";
        const alert = document.createElement("p"); alert.id = "app-boot-error"; alert.setAttribute("role", "alert");
        alert.textContent = "The application could not be loaded. Reload this page or reset the offline app cache."; document.body.prepend(alert);
      });
    </script>
</body>
</html>
